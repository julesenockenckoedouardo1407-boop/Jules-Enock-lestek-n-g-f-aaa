name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install

      - name: Préparer les fichiers web
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes Android
        run: npx capacitor-assets generate --android

      - name: Synchroniser l'application
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Jules-Enock-Lesteke-Jwet-Mab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
